name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build release package
        shell: pwsh
        run: .\build\publish.ps1 -Configuration Release -Runtime win-x64 -Zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reverse1999UrlCatcher-Release-win-x64
          path: |
            dist/Reverse1999UrlCatcher-Release-win-x64.zip
            dist/Reverse1999UrlCatcher/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Reverse1999UrlCatcher-Release-win-x64.zip
            dist/Reverse1999UrlCatcher/SHA256SUMS.txt
